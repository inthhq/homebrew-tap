name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: brew install / test / audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      # Symlink the checkout into the standard Homebrew taps location so
      # `brew install inthhq/tap/inrepo` resolves correctly. `brew tap user/repo PATH`
      # is not a stable interface in modern Homebrew.
      - name: Wire workspace as inthhq/tap
        run: |
          set -euxo pipefail
          REPO="${{ github.repository }}"
          ORG="${REPO%%/*}"
          NAME="${REPO##*/}"
          TAP_PARENT="$(brew --repository)/Library/Taps/${ORG}"
          mkdir -p "$TAP_PARENT"
          ln -s "$GITHUB_WORKSPACE" "${TAP_PARENT}/${NAME}"
          brew tap

      - name: Tap syntax
        run: brew test-bot --only-tap-syntax

      - name: Install formula
        run: brew install --build-from-source --verbose inthhq/tap/inrepo

      - name: Run brew test
        run: brew test inthhq/tap/inrepo

      - name: Audit formula
        run: brew audit --strict --online inthhq/tap/inrepo

      - name: Smoke test CLI
        run: |
          inrepo --help | head -5
          inrepo --help | grep -q "Usage:"
